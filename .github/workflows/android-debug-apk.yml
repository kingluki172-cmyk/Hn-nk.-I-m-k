
name: Ciaorelated - Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: |
          pnpm --dir apps/ciaorelated exec expo prebuild \
            --platform android \
            --no-install

      - name: Build APK
        working-directory: apps/ciaorelated/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ciaorelated-Android-APK
          path: apps/ciaorelated/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
